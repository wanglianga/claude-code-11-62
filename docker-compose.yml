services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bonded
      POSTGRES_USER: bonded
      POSTGRES_PASSWORD: bonded
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonded -d bonded"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bonded?currentSchema=bonded_ledger
      DB_USER: bonded
      DB_PASSWORD: bonded
      # Seeds a worked demo ledger on first start so the replay endpoint has an example.
      SEED_DEMO: "true"
    ports:
      - "8080:8080"

volumes:
  db-data:
